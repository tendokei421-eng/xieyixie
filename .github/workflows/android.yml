name: 打包安卓 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 安装 Capacitor
        run: npm install --no-save @capacitor/core@^7.4.3 @capacitor/cli@^7.4.3 @capacitor/android@^7.4.3 @capacitor/local-notifications@^7.0.3

      - name: 构建写入安装包的网页
        run: npm run build:capacitor

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 生成安卓工程并同步网页
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android-notify.mjs

      - name: 编译可安装的调试包
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 准备发布用 APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/*.apk dist-apk/xieyixie.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xieyixie-debug
          path: dist-apk/xieyixie.apk
          if-no-files-found: error

      - name: 发布到可分享的下载页
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 歇一歇 安卓安装包
          make_latest: true
          files: dist-apk/xieyixie.apk
          body: |
            点下面链接下载安装包（调试版）：

            https://github.com/tendokei421-eng/xieyixie/releases/latest/download/xieyixie.apk

            手机需允许「未知来源」。微信里请用系统浏览器打开。
